services:
  web:
    image: nginx:alpine
    restart: on-failure
    working_dir: /usr/share/nginx/html
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/index.html"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
