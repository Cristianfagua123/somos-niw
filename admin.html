<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Niw · Panel de Administración</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/images/Logo/logo_niw_wordmark.png">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body data-theme="light" id="app-body">

  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      </div>
      <h1 class="login-title">Bienvenido de nuevo</h1>
      <p class="login-subtitle">Inicia sesión en tu cuenta</p>

      <button type="button" id="login-google" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        <span>Continuar con Google</span>
      </button>

      <div class="login-divider"><span>O</span></div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="login-email">Correo</label>
          <div class="input-with-icon">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="login-email" required placeholder="you@example.com">
          </div>
        </div>
        <div class="form-group">
          <div class="label-row">
            <label for="login-password">Contraseña</label>
            <a href="#" id="login-forgot" class="link-accent">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="input-with-icon">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="login-password" required placeholder="••••••••">
          </div>
        </div>
        <div id="login-error" class="login-error"></div>
        <button type="submit" class="btn-login">Iniciar sesión</button>
      </form>

      <p class="login-footer">¿No tienes una cuenta? <a href="#" id="login-create" class="link-accent">Crear una</a></p>
      <a href="#" id="login-reset" class="login-reset">¿Problemas para ingresar? Restablecer acceso</a>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app-shell" class="app-shell" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="assets/images/logo.png" alt="Niw" class="sidebar-logo">
        <span class="sidebar-brand">Niw<span class="dot">.</span></span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main-area">
      <!-- Topbar -->
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Menú">☰</button>
        <div class="topbar-title" id="topbar-title">Resumen Ejecutivo</div>
        <div class="topbar-actions">
          <div class="date-range-selector">
            <select id="date-range" class="select-compact">
              <option value="this_month">Este mes</option>
              <option value="last_month">Mes anterior</option>
              <option value="this_quarter">Trimestre</option>
              <option value="this_year">Año</option>
              <option value="custom">Personalizado</option>
            </select>
          </div>
          <div id="custom-date-range" class="custom-date-range" style="display:none;">
            <input type="date" id="date-from">
            <input type="date" id="date-to">
          </div>
          <button class="btn btn-ghost" id="btn-export" title="Exportar a PDF/Excel">📥 Exportar</button>
          <button class="btn btn-ghost" id="btn-theme" title="Modo claro/oscuro">🌙</button>
        </div>
      </header>

      <!-- Content -->
      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title"></h2>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="assets/js/admin/store.js"></script>
  <script src="assets/js/admin/auth.js"></script>
  <script src="assets/js/admin/ui.js"></script>
  <script src="assets/js/admin/cartera.js"></script>
  <script src="assets/js/admin/compras.js"></script>
  <script src="assets/js/admin/finanzas.js"></script>
  <script src="assets/js/admin/ventas.js"></script>
  <script src="assets/js/admin/meta_ads.js"></script>
  <script src="assets/js/admin/ingenieria.js"></script>
  <script src="assets/js/admin/proyectos.js"></script>
  <script src="assets/js/admin/resumen.js"></script>
  <script src="assets/js/admin/app.js"></script>
</body>
</html>
